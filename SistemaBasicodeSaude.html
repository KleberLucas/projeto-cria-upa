<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UPA 24H</title>
 
    <link rel="stylesheet" href="UPA.css">
</head>
 
<body>
 
    <header>
<!-- LOGO DA UPA -->
<div class="logo-upa">
<img src="LOGOUPA.PNG" alt="Logo UPA">
</div>
 
        <!-- TÍTULO TOPO -->
<div class="titulo-topo">
<h2>PRÉ-TRIAGEM</h2>
<h4>Protocolo de Manchester</h4>
</div>
 
        <!-- INFORMAÇÃO DA DATA -->
<div class="info-topo">
<div class="data">
                📅 22/05/2024
</div>
 
            <div class="hora">
                🕒 10:30
</div>
</div>
</header>
 
    <!-- LINHA VERDE -->
<div class="linha"></div>
 
    <!-- CONTEÚDO -->
<main>
 
        <h1>Bem-vindo!</h1>
 
        <p class="texto">
            Este totem irá ajudá-lo a realizar sua pré-triagem
            de forma rápida e segura.
</p>
 
        <!-- BOTÃO -->
<button class="btn-iniciar"
                onclick="window.location.href='DadosCadastrais.html'">
 
            <span class="icon">☝️</span>
 
            <span>
                INICIAR <br>
                PRÉ-TRIAGEM
</span>
 
        </button>
 
        <!-- SEGURANÇA -->
<div class="seguranca">
 
            <span class="cadeado">🔒</span>
 
            <p>
                Seus dados estão protegidos. <br>
                Este é um ambiente seguro.
</p>
 
        </div>
 
    </main>
 
    <!-- ACESSIBILIDADE -->
<footer>
 
        <h3>RECURSOS DE ACESSIBILIDADE</h3>
 
        <div class="acessibilidade">
 
            <button class="ac-btn">
                🔊 ÁUDIO
<small>Ativar narração</small>
</button>
 
            <button class="ac-btn">
                A+ AUMENTAR FONTE
<small>Tornar o texto maior</small>
</button>
 
        </div>
 
    </footer>
 
</body>
</html>
